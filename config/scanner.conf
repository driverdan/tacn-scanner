# Scanner settings, read by trunk-recorder.sh (bash syntax: KEY=value, no spaces around "=").
# An environment variable of the same name overrides the value here,
# e.g. SDR_HOST=10.0.0.5 ./trunk-recorder.sh

# ── First SDR (rtl_tcp): low half of the site ────────────────────────────
SDR_HOST=192.168.8.132
SDR_PORT=1234
# Full osmosdr device string. Leave empty to build "rtl_tcp=SDR_HOST:SDR_PORT".
SDR_ARGS=""

# ── SDR reception ────────────────────────────────────────────────────────
SDR_GAINS="LNA:40"     # osmosdr gain string
SDR_PPM=-4             # frequency correction (whole ppm: rtl_tcp ignores fractions); measured −3.9 ppm via AutoTune

# ── Second SDR: high half of the site ────────────────────────────────────
# trunk-recorder records only inside fixed SDR windows, so the whole site takes two dongles.
# Host and gains/ppm default to the first SDR's; leave SDR2_PORT/SDR2_ARGS empty for one dongle.
SDR2_HOST=""
SDR2_PORT=1235
SDR2_ARGS=""
SDR2_GAINS=""          # empty = same as SDR_GAINS
SDR2_PPM=-4            # measured −4.3 ppm via AutoTune; empty = same as SDR_PPM

# ── Launcher ─────────────────────────────────────────────────────────────
TRANSCRIBE=1           # 0 = record only, no Whisper
WHISPER_MODEL=large-v3 # faster-whisper model (distil-large-v3 is faster, less accurate)
