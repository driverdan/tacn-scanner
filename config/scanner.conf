# Scanner settings, read by compose.yaml (env_file) for the trunk-recorder-config and transcriber services.
# Plain KEY=value lines: no spaces around "=", no quotes, comments on their own lines.
# After editing: docker compose up -d   (recreates the services whose settings changed)

# ── First SDR: low half of the site ──────────────────────────────────────
# A remote dongle served by rtl_tcp:
SDR_HOST=192.168.8.132
SDR_PORT=1234
# Or a full osmosdr device string, which overrides the two above. Empty = "rtl_tcp=SDR_HOST:SDR_PORT".
# For a dongle plugged into this machine: rtl=0 (device index) or rtl=00000101 (serial number).
# USB dongles also need compose.usb.yaml: see "USB dongles" in README.md.
SDR_ARGS=

# ── SDR reception ────────────────────────────────────────────────────────
# osmosdr gain string
SDR_GAINS=LNA:40
# Frequency correction (whole ppm: RTL-SDRs ignore fractions); measured −3.9 ppm via AutoTune
SDR_PPM=-4

# ── Second SDR: high half of the site ────────────────────────────────────
# trunk-recorder records only inside fixed SDR windows, so the whole site takes two dongles.
# Host and gains/ppm default to the first SDR's; leave SDR2_PORT/SDR2_ARGS empty for one dongle.
# SDR2_ARGS works like SDR_ARGS (rtl=1, or the second dongle's serial number).
SDR2_HOST=
SDR2_PORT=1235
SDR2_ARGS=
# Empty = same as SDR_GAINS
SDR2_GAINS=
# Measured −4.3 ppm via AutoTune; empty = same as SDR_PPM
SDR2_PPM=-4

# ── Transcriber ──────────────────────────────────────────────────────────
# faster-whisper model (distil-large-v3 is faster, less accurate)
WHISPER_MODEL=large-v3
