# Scanner settings, read by scanner.sh (bash syntax: KEY=value, no spaces around "=").
# An environment variable of the same name overrides the value here,
# e.g. SDR_HOST=10.0.0.5 ./scanner.sh

# ── SDR connection (rtl_tcp) ─────────────────────────────────────────────
SDR_HOST=192.168.8.132
SDR_PORT=1234
# Full osmosdr device string. Leave empty to build "rtl_tcp=SDR_HOST:SDR_PORT".
# Set it for a local dongle instead, e.g. SDR_ARGS="rtl=0".
SDR_ARGS=""

# ── SDR reception ────────────────────────────────────────────────────────
SDR_GAINS="LNA:40"     # osmosdr gain string
SDR_PPM=0.0            # frequency correction

# ── Launcher ─────────────────────────────────────────────────────────────
TRANSCRIBE=1           # 0 = relay audio only, no Whisper
WHISPER_MODEL=large-v3 # faster-whisper model (distil-large-v3 is faster, less accurate)
OP25_VERBOSITY=1       # 10 logs grants and "voice update: tg(...)"
